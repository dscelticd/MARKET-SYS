name: Market Flow Auto Report

# (워크플로 재인식 트리거용 메타 변경 — 2026-08-08)
# ──────────────────────────────────────────────────────────────────────────────
# 실행 트리거 (요일은 UTC 기준 — KST는 UTC+9)
#   - 아침 브리핑 07:10 KST : 월~토 (일요일 제외)
#   - 저녁 결산   20:40 KST : 월~금 (주말 제외)
#   - 수동 실행 (workflow_dispatch) → 테스트용
#
# 왜 주말 실행을 줄였나:
#   주말에는 증시가 열리지 않아 yfinance가 금요일 종가를 그대로 반환한다. 기존에는
#   요일 구분 없이 매일 2회 실행해, 같은 금요일 종가가 토요일 아침·저녁·일요일
#   아침까지 최대 4번 "당일 등락률"로 반복 보고됐다(실측: 삼성전자 281,500원 +3.87%가
#   4개 리포트에 동일 등장). 등급 이력에도 중복 스냅샷이 쌓여 적중률 통계를 왜곡시켰다.
#
#   단, **토요일 아침(KST)은 유지한다** — 미국 금요일 정규장 마감이 토요일 05:00 KST라
#   토요일 07:00 리포트에 미국 금요일 종가가 처음 담기기 때문. 주간 마감 결산 성격.
#   나머지(토요일 저녁·일요일 아침/저녁)는 새 데이터가 없는 순수 중복이라 제외.
# ──────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # 정각(:00)·반정각(:30)은 GitHub Actions에서 가장 혼잡한 슬롯이라 예약 실행이
    # 크게 밀린다. 밀린 저녁 작업이 KST 새벽에 발송되는 사고가 있어 분 단위를 비켰다.
    # UTC 일~금 22:10 = KST 월~토 07:10 (KST 일요일 아침만 제외)
    - cron: '10 22 * * 0-5'
    # UTC 월~금 11:40 = KST 월~금 20:40 (KST 주말 저녁 제외)
    - cron: '40 11 * * 1-5'
  workflow_dispatch:
    inputs:
      report_type:
        description: '리포트 유형 선택'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  run-report:
    name: 리포트 생성 및 이메일 발송
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. 코드 체크아웃 ────────────────────────────────────────────────────
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      # ── 2. Python 환경 설정 ─────────────────────────────────────────────────
      - name: Python 3.11 설정
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-cloud.txt'

      # ── 3. 의존성 설치 (클라우드 전용 — Dashboard 제외) ─────────────────────
      - name: 의존성 설치
        run: pip install --upgrade pip && pip install -r requirements-cloud.txt

      # ── 3-1. 한글 폰트 설치 (캔들차트 이미지 한글 렌더링용) ───────────────────
      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-nanum

      # ── 4. .env 파일 생성 (Secrets → 환경변수) ─────────────────────────────
      - name: .env 파일 생성
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL:        ${{ secrets.CLAUDE_MODEL }}
          SMTP_USER:           ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:       ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:          ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:            ${{ secrets.EMAIL_TO }}
          NAVER_CLIENT_ID:     ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DART_API_KEY:        ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY:         ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET:      ${{ secrets.KIS_APP_SECRET }}
          KIS_ENV:             ${{ secrets.KIS_ENV }}
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
        run: |
          {
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
            echo "CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}"
            echo "SMTP_HOST=smtp.gmail.com"
            echo "SMTP_PORT=587"
            echo "SMTP_USER=${SMTP_USER}"
            echo "SMTP_PASSWORD=${SMTP_PASSWORD}"
            echo "EMAIL_FROM=${EMAIL_FROM}"
            echo "EMAIL_TO=${EMAIL_TO}"
            echo "USE_MOCK_DATA=false"
            echo "NAVER_CLIENT_ID=${NAVER_CLIENT_ID}"
            echo "NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}"
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
            echo "TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}"
            echo "DART_API_KEY=${DART_API_KEY}"
            echo "KIS_APP_KEY=${KIS_APP_KEY}"
            echo "KIS_APP_SECRET=${KIS_APP_SECRET}"
            echo "KIS_ENV=${KIS_ENV:-demo}"
            echo "FRED_API_KEY=${FRED_API_KEY}"
            echo "REPORT_SAVE_DIR=data/reports"
            echo "REPORT_LANGUAGE=ko"
          } > .env

      # ── 5. 데이터 디렉토리 생성 ─────────────────────────────────────────────
      - name: 데이터 디렉토리 생성
        run: mkdir -p data/reports data/history data/logs data/cache

      # ── 5-1. KIS 접근토큰 캐시 복원/저장 (1일 1회 발급 원칙 준수) ───────────
      # GitHub Actions는 실행마다 새 가상머신이라 로컬 파일 캐시가 지속되지
      # 않음 — 캐시 없이는 아침/저녁 실행마다 토큰을 새로 발급받게 되어
      # KIS의 "1일 1회 발급 원칙"을 위반하고 잦은 재발급으로 이용 제한을
      # 받을 수 있음. 날짜별 캐시 키로 같은 날 여러 번 실행돼도(예약+수동)
      # 토큰을 재사용하도록 함 (KIS 토큰 유효기간 24시간과 매치).
      - name: 오늘 날짜 계산 (KIS 토큰 캐시 키)
        id: kis_date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: KIS 접근토큰 캐시
        uses: actions/cache@v5
        with:
          path: data/cache/kis_token.json
          key: kis-token-${{ steps.kis_date.outputs.date }}

      # ── 5-2. 등급 이력 누적 (전일 대비 변화·적중률의 전제) ──────────────────
      # 러너는 매 실행마다 새 VM이라 data/history/가 초기화된다. 그 결과 자동 실행
      # 리포트가 매번 "모든 등급은 첫 등재(신규 등재)로 이전 이력과 비교 불가"·
      # "적중률 통계 아직 없음"으로 나갔다 — 등급 변화 추적과 적중률(요인별 포함)이
      # 클라우드에서는 영구히 작동하지 않는 상태였다(2026-09-01 발송분에서 확인).
      #
      # run_id를 키로 매번 새 캐시를 쓰고 restore-keys로 직전 것을 복원하는
      # "누적 캐시" 패턴. 커밋을 남기지 않아 저장소가 오염되지 않는다.
      # 한계: GitHub 캐시는 7일간 미사용 시 삭제된다. 하루 2회 실행되는 동안에는
      # 만료되지 않지만, 워크플로를 일주일 이상 멈추면 이력이 초기화된다.
      - name: 등급 이력 복원/누적
        uses: actions/cache@v5
        with:
          path: data/history
          key: ratings-history-${{ github.run_id }}
          restore-keys: |
            ratings-history-

      # ── 6. 리포트 유형 결정 ─────────────────────────────────────────────────
      # 어느 크론이 발동했는지로 판정한다. 이전에는 "실행된 시각"(date -u +%H)으로
      # 추론했는데, GitHub Actions 예약 실행이 밀리면 유형이 뒤바뀌었다 —
      # 아침 작업(22:10 UTC)이 자정을 넘겨 밀리면 HOUR_UTC=0이 되어
      # "아침에 저녁 결산이 도착"하는 상황이 발생했다.
      # github.event.schedule은 실제 발동한 크론 문자열이라 지연과 무관하게 정확하다.
      - name: 리포트 유형 결정
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "REPORT_TYPE=${{ inputs.report_type }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "10 22 * * 0-5" ]; then
            echo "REPORT_TYPE=morning" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "40 11 * * 1-5" ]; then
            echo "REPORT_TYPE=evening" >> "$GITHUB_ENV"
          else
            # 크론을 수정하고 이 분기를 갱신하지 않으면 여기로 온다 — 조용히
            # 잘못된 유형을 보내는 대신 실패시켜 즉시 드러나게 한다.
            echo "::error::알 수 없는 스케줄 '${{ github.event.schedule }}' — 크론과 유형 판정이 어긋났습니다"
            exit 1
          fi

      # ── 7. 리포트 생성 + 이메일 발송 ────────────────────────────────────────
      - name: 리포트 생성 및 이메일 발송
        run: python app/main.py --report "$REPORT_TYPE" --send-email

      # ── 8. 실패 시 Telegram 오류 알림 ─────────────────────────────────────
      - name: 오류 알림 (실패 시)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PYEOF'
          import os
          # heredoc(python -)로 실행하면 호출자 프레임이 없어 find_dotenv()의
          # 프레임 검사가 AssertionError를 냄 -> 경로를 명시해 우회
          from dotenv import load_dotenv; load_dotenv(".env")
          from app.utils.telegram_notifier import TelegramNotifier
          n = TelegramNotifier()
          n.notify_error(
              f"GitHub Actions 워크플로 실패 (run #{os.getenv('GITHUB_RUN_NUMBER','?')})",
              os.getenv("REPORT_TYPE", "unknown"),
          )
          PYEOF
        continue-on-error: true

      # ── 9. 로그 업로드 (실패 시 디버깅용) ──────────────────────────────────
      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: market-flow-logs-${{ env.REPORT_TYPE }}-${{ github.run_number }}
          path: data/logs/
          retention-days: 7
