# 클라우드(GitHub Actions) 의존성 고정 목록 — pip 제약 파일(-c)로 쓴다
#
# 왜 고정하나: requirements-cloud.txt는 '이 버전 이상'만 적혀 있어 매 실행이 그날의
# 최신판을 설치한다. yfinance는 업데이트로 동작이 자주 바뀌고(2026-09 일봉 Close가
# 비는 현상), 2026-10-22에는 pandas 3.1.0이 예고 없이 운영에 들어왔다. 고정하면
# 올리는 시점을 직접 정하고, 올리기 전에 수동 실행(dry_run)으로 먼저 시험할 수 있다.
#
# 이 목록은 2026-10-27 07:10 KST 운영 실행이 실제로 설치한 조합이다(이후 배포된
# 버전 없음을 PyPI 배포 시각으로 확인). 갱신 방법:
#   pip install --dry-run --ignore-installed --report rep.json --python-version 3.11 \
#     --implementation cp --abi cp311 --platform manylinux_2_28_x86_64 \
#     --platform manylinux2014_x86_64 --only-binary=:all: -r requirements-cloud.txt
#   → rep.json의 install 목록으로 이 파일을 다시 쓰고, dry_run으로 시험한 뒤 커밋

